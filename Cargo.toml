[workspace]
resolver = "2"
members = [
    "crates/booth",
    "crates/realm",
    "crates/config",
    "crates/engine",
    "crates/cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

