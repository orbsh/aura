[workspace]
resolver = "2"
members = [
    "crates/booth",
    "crates/realm",
    "crates/config",
    "crates/engine",
    "crates/cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
# A background loop has no caller to return to, so its failures need a place
# to land that is not silence. The facade is a no-op until the host installs
# a subscriber (aura-cli does).
tracing = "0.1"


[workspace.lints.clippy]
# The standing rule: a fallible step returns `Result`, an absent value returns
# `Option`, and neither is short-circuited by a panic. deny (not forbid) so a
# genuinely impossible state can carry a narrow, commented allow.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
