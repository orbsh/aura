[workspace]
resolver = "2"
members = [
    "crates/actor",
    "crates/realm",
    "crates/storage",
    "crates/config",
    "crates/engine",
    "crates/cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"


[patch."https://github.com/orbsh/okm"]
okm-core = { path = "/home/master/world/okm/okm-core" }
okm-derive = { path = "/home/master/world/okm/okm-derive" }
okm-wire = { path = "/home/master/world/okm/okm-wire" }
