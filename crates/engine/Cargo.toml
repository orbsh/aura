[package]
name = "aura-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aura-booth = { path = "../booth" }
aura-realm = { path = "../realm" }
aura-config = { path = "../config" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = "0.24"
futures-util = "0.3"
probe-protocol = { path = "../../../probe/crates/protocol" }
probe-config = { path = "../../../probe/crates/config" }
probe-runtime = { path = "../../../probe/crates/runtime" }
tempfile = "3"
base64 = "0.22"

[features]
default = []
steel = ["aura-realm/steel"]
python = ["aura-realm/python"]
wasmtime = ["aura-realm/wasmtime"]
nushell = ["aura-realm/nushell"]
fjall = ["aura-realm/fjall", "dep:okm-core", "dep:fjall"]

[dependencies.okm-core]
git = "https://github.com/orbsh/okm"
branch = "main"
features = ["fjall"]
optional = true

[dependencies.fjall]
version = "3.1.10"
optional = true
