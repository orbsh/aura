[package]
name = "aura-realm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aura-actor = { path = "../actor" }
aura-storage = { path = "../storage" }
probe-runtime = { path = "../../../probe/crates/runtime" }
probe-protocol = { path = "../../../probe/crates/protocol" }
okm-core = { path = "../../../okm/okm-core", features = ["fjall"] }
base64 = "0.22"
ciborium = "0.2"
tokio-tungstenite = "0.24"
futures-util = "0.3"
aura-config = { path = "../config" }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
steel = ["probe-runtime/steel"]
python = ["probe-runtime/python"]
wasmtime = ["probe-runtime/wasmtime"]
nushell = ["probe-runtime/nushell"]

[dependencies.anyhow]
workspace = true

[dependencies.tokio]
workspace = true
