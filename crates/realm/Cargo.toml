[package]
name = "aura-realm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aura-booth = { path = "../booth" }
effector-runtime = { path = "../../../effector/crates/runtime" }
effector-protocol = { path = "../../../effector/crates/protocol" }
okm-core = { git = "https://github.com/orbsh/okm", branch = "main", features = ["fjall", "schema-serde"] }
okm-dynamic = { git = "https://github.com/orbsh/okm", branch = "main" }
okm-wire = { git = "https://github.com/orbsh/okm", branch = "main" }
base64 = "0.22"
sha2 = "0.10"
fjall = { version = "3.1.10", optional = true }
tokio-tungstenite = "0.24"
futures-util = "0.3"
aura-config = { path = "../config" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio-util = { version = "0.7.19", features = ["time"] }

[features]
default = []
fjall = ["dep:fjall"]
steel = ["effector-runtime/steel"]
python = ["effector-runtime/python"]
wasmtime = ["effector-runtime/wasmtime"]

[dependencies.anyhow]
workspace = true

[dependencies.tokio]
workspace = true
